<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabernacle</title>
    <link rel="icon" href="icons/tabernacle.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="tree.css" />
    <link rel="stylesheet" href="picker-dialog.css" />
    <link rel="stylesheet" href="move-dialog.css" />
    <link rel="stylesheet" href="container-picker.css" />
    <script type="module" src="src/sidebar.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <header id="sidebar-header">
        <div class="navigation-capsule" id="navigation-capsule">
          <nav class="navigation" id="breadcrumbs" aria-label="Folder path">
            <button
              class="crumb icon-button"
              id="home"
              title="Home — show all tabs"
              aria-label="Home"
            ></button>
            <div id="group-path" class="breadcrumbs"></div>
          </nav>
          <div class="search-toggle-track">
            <button
              class="icon-button"
              id="search-toggle"
              aria-label="Search tabs and folders"
              title="Search tabs and folders (⌘/Ctrl K)"
              aria-controls="search-wrap"
              aria-expanded="false"
            ></button>
          </div>
          <div class="search-wrap" id="search-wrap" role="search" aria-hidden="true" inert>
            <label class="sr-only" for="search">Search tabs and folders in this folder</label>
            <input
              id="search"
              type="search"
              placeholder="Search tabs…"
              autocomplete="off"
              spellcheck="false"
              aria-controls="tree"
            />
            <button
              class="icon-button"
              id="search-close"
              aria-label="Close search"
              title="Close search (Esc)"
            ></button>
          </div>
        </div>
        <div id="domain-header" class="domain-header" hidden>
          <canvas class="domain-wash" width="1" height="1" aria-hidden="true"></canvas>
          <span id="domain-icon" class="domain-icon" aria-hidden="true"></span>
          <div class="domain-heading">
            <h1 id="domain-name"></h1>
            <p id="domain-address" hidden></p>
          </div>
          <button
            type="button"
            id="domain-close"
            aria-label="Close domain view"
            title="Return to folders (Esc)"
          ></button>
        </div>
        <p id="domain-status" class="sr-only" role="status"></p>
        <div
          id="pinned-tabs"
          class="pinned-tabs"
          role="group"
          aria-label="Pinned tabs and folders"
          hidden
        ></div>
      </header>
      <div id="domain-tools" class="domain-tools" hidden>
        <span id="domain-count"></span>
        <label class="sr-only" for="domain-sort">Sort filtered tabs</label>
        <select id="domain-sort" aria-controls="tree">
          <option value="newest">Newest opened</option>
          <option value="viewed">Recently viewed</option>
          <option value="oldest">Oldest opened</option>
          <option value="title">Title A–Z</option>
          <option value="tree">Tree order</option>
        </select>
      </div>
      <main id="tree" class="tree" role="tree" aria-label="Tabs and folders" tabindex="0">
        <p class="loading">Opening your tabs…</p>
      </main>
      <button id="reveal" class="reveal" hidden>Current tab is hidden <span>Show</span></button>
      <footer>
        <div class="footer-actions" role="group" aria-label="Tab actions">
          <button id="new-tab" aria-label="New tab" title="New tab" disabled></button>
          <button id="new-group" aria-label="New folder" title="New folder" disabled></button>
          <span class="dock-divider" aria-hidden="true"></span>
          <button
            id="tree-toggle"
            aria-label="Expand or collapse folders and tabs"
            title="Expand or collapse folders and tabs"
            aria-controls="tree"
            disabled
          ></button>
          <button
            id="recently-closed-toggle"
            aria-label="Recent activity"
            title="Recent activity"
            aria-haspopup="dialog"
            aria-controls="recently-closed"
            aria-expanded="false"
            disabled
          ></button>
          <button id="settings" aria-label="Settings" title="Settings"></button>
        </div>
      </footer>
    </div>
    <div id="menu" class="menu" role="menu" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="dialog-form">
        <button type="button" id="dialog-back" class="dialog-back" hidden></button>
        <div class="dialog-heading">
          <div class="dialog-icon" id="dialog-icon"></div>
          <h2 id="dialog-title"></h2>
          <button
            type="button"
            id="dialog-close"
            class="icon-button"
            aria-label="Close dialog"
            hidden
          ></button>
        </div>
        <p id="dialog-description"></p>
        <label id="dialog-label" for="dialog-input">Folder name</label
        ><input id="dialog-input" maxlength="80" autocomplete="off" required /><select
          id="dialog-select"
          aria-label="Destination folder"
          hidden
        ></select>
        <div id="dialog-content" hidden></div>
        <div id="container-picker-content" hidden>
          <div class="picker-search-field">
            <label for="container-search">Container</label>
            <div class="picker-search" id="container-search-field">
              <input
                id="container-search"
                type="search"
                placeholder="Search containers"
                autocomplete="off"
                aria-controls="dialog-options"
              />
              <button
                type="button"
                id="container-search-clear"
                class="picker-search-clear"
                aria-label="Clear container search"
                hidden
              ></button>
            </div>
          </div>
          <div
            id="dialog-options"
            class="dialog-options"
            role="radiogroup"
            aria-label="Containers"
            hidden
          ></div>
          <p id="container-search-status" class="sr-only" role="status"></p>
          <div id="container-tools" class="container-tools" hidden>
            <button type="button" id="create-container">New container…</button>
            <button type="button" id="manage-containers">Manage containers…</button>
          </div>
          <p id="container-picker-note" hidden></p>
        </div>
        <p id="dialog-error" class="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button
          ><button type="submit" id="dialog-submit" class="primary">Create folder</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
