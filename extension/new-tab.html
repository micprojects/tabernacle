<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New tab · Tabernacle</title>
    <link rel="icon" href="icons/tabernacle.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="new-tab.css" />
    <script type="module" src="src/new-tab-page.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#new-tab-content">Skip to content</a>
    <div class="page-top">
      <div class="brand">
        <img src="icons/tabernacle.svg" alt="" width="30" height="30" />Tabernacle
      </div>
      <div class="page-tools">
        <aside id="weather" aria-label="Weather" hidden></aside>
        <button id="customise" class="page-button">
          <span data-icon="settings"></span>Customise
        </button>
      </div>
    </div>
    <main id="new-tab-content">
      <div class="intro">
        <h1 class="sr-only">New tab</h1>
        <time id="clock" aria-label="Current time"></time>
        <p id="date" class="date"></p>
      </div>
      <p id="preview-notice" class="notice" hidden>
        Preview of your settings. This does not change Firefox’s new tab page.
      </p>
      <p id="page-error" class="error" role="alert" hidden></p>
      <div id="loading" class="empty" role="status">Loading your links…</div>
      <section id="search-section" aria-label="Search" hidden>
        <form id="search-form">
          <span data-icon="searchLarge"></span
          ><input
            id="search"
            type="search"
            aria-label="Search the web or your tabs"
            aria-describedby="search-help"
            placeholder="Search the web or your tabs…"
            autocomplete="off"
            maxlength="2048"
          /><button type="submit" class="search-submit" aria-label="Search the web">
            <span data-icon="enter"></span>
          </button>
        </form>
        <p id="search-help" class="sr-only">
          Enter searches the web with your Firefox search engine, or opens a website address.
        </p>
        <div id="search-results" hidden>
          <h2>Open tabs and folders</h2>
          <p id="search-status" class="sr-only" role="status"></p>
          <div id="search-matches"></div>
        </div>
      </section>
      <section id="links-section" class="page-section" aria-labelledby="links-title" hidden>
        <h2 id="links-title" class="sr-only">Favourite links</h2>
        <div id="links" class="links"></div>
      </section>
      <section id="recent-section" class="page-section" aria-labelledby="recent-title" hidden>
        <div class="section-heading">
          <h2 id="recent-title" tabindex="-1">Recently closed</h2>
          <button id="all-recent" class="text-button" aria-expanded="false" aria-controls="recent">
            View all
          </button>
        </div>
        <div id="recent"></div>
      </section>
      <p id="page-status" role="status" class="status"></p>
    </main>
  </body>
</html>
